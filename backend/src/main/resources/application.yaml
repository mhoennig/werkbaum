spring:
  application:
    name: editor-backend

  datasource:
    # H2 im File-Modus mit PostgreSQL-Kompatibilitaet.
    # Spaeterer Umstieg auf echtes PostgreSQL = im Wesentlichen nur diese URL aendern.
    url: jdbc:h2:file:./data/editor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Schema kommt ausschliesslich von Liquibase
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql

  threads:
    virtual:
      # Der Aenderungsfeed blockiert seinen Thread, bis sich etwas tut
      # (Long Polling). Auf einem virtuellen Thread kostet das Warten fast
      # nichts - ein Plattform-Thread je Beobachter waere ein Megabyte Stack
      # auf einem Host, dessen knappe Groesse der Speicher ist (D76).
      enabled: true

werkbaum:
  live-editing:
    # Schreibpause, nach der die letzte Version zum Meilenstein wird.
    milestone-pause: 30s
    # Danach wird eine Sync-Version verdichtet; der Feed antwortet auf ein so
    # altes "since" dann mit Volltext statt mit einem Diff.
    sync-retention: 1h
    # Obergrenze fuers Warten am Feed. Gemessen: Apache auf der Zielumgebung
    # haelt einen Long-Poll 30 s durch, seine Zeitgrenzen liegen bei 300 s.
    max-wait: 25s

  # Von welchen Herkuenften darf der Editor die API ansprechen? "*" ist die
  # Voreinstellung: Zugriff regelt die unerratbare UUID, nicht die Herkunft,
  # und Cookies werden nie mitgesendet. Enger geht ueber eine Liste.
  cors:
    allowed-origins: "*"

  # Schutz der Dokumentenliste. BCrypt-Hash, NIE im Repository - er kommt aus
  # der Umgebung. Ohne ihn bleibt GET /documents gesperrt.
  master-password:
    hash: ${WERKBAUM_MASTER_PASSWORD_HASH:}
    max-attempts: 5
    lockout: 15m

server:
  port: 8080
